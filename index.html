<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى هاجر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #e1e8ed;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.7;
            margin: 15px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 10px 22px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 600;
        }

        .btn-yes {
            background-color: #25d366;
            color: white;
        }

        .btn-yes:hover {
            background-color: #1ebc57;
        }

        .btn-no {
            background-color: #e74c3c;
            color: white;
            position: relative;
        }

        #response-message {
            margin-top: 20px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>السموحة أ هاجر 🙏</h1>
        
        <p>
            عارف راسي غلطت ولا تصرفت بشي طريقة ماشي هي هذيك، ومكانش قصدي نضايقك كاع.<br><br>
            عزيزة عليا وما بغيتش يبقى بيناتنا سوء فهم. حقك عليا وسامحي ليا!
        </p>

        <p>صافي صافية لبن؟ 🤝</p>

        <div class="buttons">
            <button class="btn-yes" onclick="acceptApology()">صافي مسامحة 👍</button>
            <button class="btn-no" id="noBtn" onmouseover="moveButton()">باقي مقلقة 😜</button>
        </div>

        <div id="response-message"></div>
    </div>

    <script>
        function acceptApology() {
            const message = document.getElementById('response-message');
            message.style.display = 'block';
            message.innerHTML = "شكراً أ هاجر! الله يعزك ✨";
            document.querySelector('.buttons').style.display = 'none';
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
    </script>
</body>
</html>
