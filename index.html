<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى هاجر ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .heart-icon {
            font-size: 50px;
            color: #e63946;
            animation: beat 1.2s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.15); }
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 20px 0;
        }

        .highlight {
            color: #d63384;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }

        .btn-yes:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            position: relative;
        }

        #response-message {
            margin-top: 20px;
            font-weight: bold;
            color: #d63384;
            font-size: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">❤️</div>
        <h1>إلى عزيزتي هاجر</h1>
        
        <p>
            عارف راسي قصرت ولا أخطأت، ومكانش قصدي نضايقك أبداً.<br>
            مكانتك عندي كبيرة بزاف، وما قادرتش نتخيل أيامي بلا بيك.<br>
            <span class="highlight">سمحي ليا بزاف يا هاجر..</span> أسراري وراحتي كلها معاك، وحبي ليك كيزيد كل نهار.
        </p>

        <p>هل تقبلين اعتذاري ونفتحو صفحة جديدة؟ ✨</p>

        <div class="buttons">
            <button class="btn-yes" onclick="acceptApology()">سامحتك ❤️</button>
            <button class="btn-no" id="noBtn" onmouseover="moveButton()">لا 😜</button>
        </div>

        <div id="response-message"></div>
    </div>

    <script>
        function acceptApology() {
            const message = document.getElementById('response-message');
            message.style.display = 'block';
            message.innerHTML = "شكراً أهاجر! ❤️ نوعدك ما غاديش نعود نزعلك مرة أخرى ✨";
            
            // إخفاء الأزرار بعد القبول
            document.querySelector('.buttons').style.display = 'none';
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // تحريك زر "لا" بشكل عشوائي عشان ما تقدرش تضغط عليه
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
    </script>
</body>
</html>
